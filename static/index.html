<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Energy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232a78d6' d='M13 2 4 14h7l-1 8 9-12h-7z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="title-row">
        <h1>
          <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
          Home energy
        </h1>
        <div class="subtitle" id="subtitle"></div>
        <div class="sync">
          <span id="sync-status"></span>
          <button class="btn" id="sync-btn" type="button">Sync now</button>
          <button class="icon-btn" id="theme-btn" type="button" title="Switch light / dark" aria-label="Switch light or dark theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </div>
      <nav class="tabs" id="tabs" role="tablist">
        <button role="tab" data-tab="overview">Overview</button>
        <button role="tab" data-tab="forecast">Predictions</button>
        <button role="tab" data-tab="patterns">Patterns</button>
        <button role="tab" data-tab="peaks">Big days</button>
        <button role="tab" data-tab="bills">Bills &amp; balance</button>
        <button role="tab" data-tab="prices">Prices &amp; tariffs</button>
        <button role="tab" data-tab="planet">Weather, carbon &amp; solar</button>
        <button role="tab" data-tab="about">Data</button>
      </nav>
    </div>
  </header>
  <div id="banner"></div>
  <main id="main"><div class="loading">Loading your energy data…</div></main>

  <div class="drawer-back" id="drawer-back"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
